[project]
name = "fundos-pipeline"
version = "0.1.0"
description = "AWS data pipeline with IaC and CI/CD on CVM open data"
requires-python = ">=3.11,<3.12"
dependencies = [
  "boto3>=1.35",
  "pandas>=2.2",
  "pyarrow>=23.0.1",
  "pandera>=0.20",
  "requests>=2.33",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "moto[s3]>=5", "ruff>=0.6", "black>=24", "mypy>=1.11", "pre-commit>=3.8", "boto3-stubs[s3]", "pandas-stubs"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=fundos_pipeline --cov-report=term-missing"
markers = ["integration: requires real AWS resources"]
